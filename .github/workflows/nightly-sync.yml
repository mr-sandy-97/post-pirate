name: Nightly Gazette Sync
​on:
schedule:
- cron: "30 18 * * *"
workflow_dispatch:
​jobs:
sync:
runs-on: ubuntu-latest
permissions:
contents: write
​steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"
​- name: Run Scraper
run: python3 scraper.py
​- name: Commit and Push Changes
run: |
git config --global user.name "PostPirate-Bot"
git config --global user.email "bot@postpirate.local"
git add data/jobs.json
git diff --quiet && git diff --staged --quiet || (git commit -m "Automated nightly sync [skip ci]" && git push)
