name: Nightly Gazette Sync & Self-Heal

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-sync
  cancel-in-progress: true

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Maintenance and Self-Heal
        run: python scraper.py

      - name: Commit and Push Verified Database
        run: |
          git config --global user.name "PostPirate-Bot"
          git config --global user.email "bot@postpirate.local"

          git add data/jobs.json
          git commit -m "Automated nightly sync: Verified vacancy database updated" || echo "No changes to commit"
          git push
