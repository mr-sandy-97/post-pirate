name: Nightly Gazette Sync & Self-Heal

on:
  schedule:
    # 18:30 UTC = 00:00 IST (next day)
    - cron: '30 18 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-sync
  cancel-in-progress: true

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping dependency installation."
          fi

      - name: Execute Maintenance and Self-Heal
        run: python scraper.py

      - name: Commit and Push Verified Database
        run: |
          git config user.name "PostPirate-Bot"
          git config user.email "bot@postpirate.local"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No database changes detected."
          else
            git commit -m "Automated nightly sync: Verified vacancy database updated"
            git push
          fi
