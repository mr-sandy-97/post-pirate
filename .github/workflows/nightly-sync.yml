name: Nightly Gazette Sync
​on:
schedule:
- cron: '30 18 * * *'
workflow_dispatch:
​jobs:
sync:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Run Scraper
run: python3 scraper.py
​- name: Set Git Name
run: git config --global user.name "PostPirate-Bot"
​- name: Set Git Email
run: git config --global user.email "bot@postpirate.local"
​- name: Push Updates
run: git add data/jobs.json && (git diff --staged --quiet || git commit -m "Nightly sync") && git push
