name: Nightly Gazette Sync
​on:
schedule:
- cron: '30 18 * * *'
workflow_dispatch:
​jobs:
sync:
runs-on: ubuntu-latest
permissions:
contents: write
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Run Scraper
run: python3 scraper.py
​- name: Commit Updates
run: |
git config user.name "PostPirate-Bot"
git config user.email "bot@postpirate.local"
git add data/jobs.json
git diff --cached --quiet || (git commit -m "Automated sync [skip ci]" && git push)
