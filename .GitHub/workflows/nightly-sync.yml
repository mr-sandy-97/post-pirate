name: Nightly Gazette Sync & Self-Heal
​on:
schedule:
# 18:30 UTC every day is exactly 12:00 AM (midnight) Indian Standard Time (IST)
- cron: '30 18 * * *'
workflow_dispatch: # Allows you to trigger the job manually anytime from the GitHub website
​jobs:
sync:
runs-on: ubuntu-latest
permissions:
contents: write
​steps:
- name: Checkout Repository
uses: actions/checkout@v3
​- name: Set up Python 3.11
uses: actions/setup-python@v4
with:
python-version: '3.11'
​- name: Run Pipeline & Self-Heal
run: |
python scraper.py
​- name: Commit & Publish Updates
run: |
git config --global user.name "PostPirate-Bot"
git config --global user.email "bot@postpirate.local"
git add data/jobs.json
git diff-index --quiet HEAD || (git commit -m "Automated nightly sync: Verified vacancy database updated [skip ci]" && git push)
